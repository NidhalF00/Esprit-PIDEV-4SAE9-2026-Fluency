<div class="application-wrapper">
  <div class="application-card">
    <h2>Apply as Teacher</h2>
    <p class="subtitle">
      Submit your CV to apply for the teacher position
    </p>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
      />
    </div>

    <div class="form-group">
      <label>Upload CV (PDF)</label>
      <input
        type="file"
        accept="application/pdf"
        (change)="onFileSelected($event)"
      />
    </div>

    <button
      class="submit-btn"
      (click)="submit()"
      [disabled]="isSubmitting"
    >
      {{ isSubmitting ? 'Submitting...' : 'Submit Application' }}
    </button>

    <div class="mt-6 rounded-2xl border border-blue-100 bg-blue-50/80 p-4 text-center shadow-sm">
      <p class="text-sm font-black text-slate-900">Do not have a CV?</p>
      <p class="mt-1 text-sm leading-6 text-slate-600">
        Build a polished tutor CV, then print or save it as PDF before applying.
      </p>
      <a
        routerLink="/cv-builder"
        class="mt-4 inline-flex items-center justify-center rounded-xl bg-gradient-to-r from-blue-600 via-cyan-500 to-violet-600 px-5 py-3 text-sm font-black text-white shadow-lg shadow-blue-500/20 transition hover:-translate-y-0.5 hover:shadow-xl"
      >
        Create CV with Fluency
      </a>
    </div>
  </div>
</div>

<!-- 🔥 POPUP -->
<div class="popup-overlay" *ngIf="showPopup">
  <div class="popup-box">
    <h3 [class.success]="popupSuccess" [class.error]="!popupSuccess">
      {{ popupSuccess ? 'Success' : 'Error' }}
    </h3>

    <p>{{ popupMessage }}</p>

    <button class="ok-btn" (click)="closePopup()">OK</button>
  </div>
</div>
