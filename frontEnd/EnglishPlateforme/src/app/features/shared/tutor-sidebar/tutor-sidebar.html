<aside class="fixed left-0 top-0 z-40 h-screen w-64 border-r border-white/60 bg-white/70 shadow-2xl shadow-blue-200/30 backdrop-blur-xl">
  <div class="flex h-full flex-col px-4 py-6">
    <div class="mb-8 rounded-3xl border border-cyan-100/80 bg-gradient-to-br from-white/85 via-cyan-50/70 to-violet-50/70 p-4 shadow-lg shadow-blue-100/40">
      <div class="flex items-center gap-3">
        <img src="assets/branding/fluency-logo.png"
             alt="Fluency logo"
             class="h-11 w-11 rounded-xl object-contain">
        <div>
          <p class="text-lg font-black tracking-tight text-slate-950">Fluency</p>
          <p class="text-xs font-bold text-slate-500">Tutor Space</p>
        </div>
      </div>
      <div class="mt-4 inline-flex rounded-full border border-emerald-100 bg-emerald-50/90 px-3 py-1 text-[11px] font-black uppercase tracking-[0.16em] text-emerald-700">
        Tutor role
      </div>
    </div>

    <nav class="flex-1">
      <p class="mb-3 px-2 text-[11px] font-black uppercase tracking-[0.24em] text-slate-400">Navigation</p>
      <ul class="space-y-2 font-semibold">
        <li>
          <a routerLink="/tutor/dashboard"
             routerLinkActive="bg-gradient-to-r from-blue-600 to-cyan-500 text-white shadow-lg shadow-blue-500/20"
             class="group flex items-center justify-between rounded-2xl border border-transparent p-3 text-slate-600 no-underline transition-all hover:-translate-y-0.5 hover:border-cyan-100 hover:bg-cyan-50/80 hover:text-[#0066FF]">
            <span>Dashboard</span>
            <span class="rounded-full bg-white/35 px-2 py-0.5 text-[10px] font-black uppercase tracking-widest">Home</span>
          </a>
        </li>
        <li>
          <a routerLink="/tutor/courses"
             routerLinkActive="bg-gradient-to-r from-blue-600 to-violet-500 text-white shadow-lg shadow-blue-500/20"
             class="group flex items-center justify-between rounded-2xl border border-transparent p-3 text-slate-600 no-underline transition-all hover:-translate-y-0.5 hover:border-violet-100 hover:bg-violet-50/80 hover:text-violet-700">
            <span>Create Welcome Quizzes</span>
            <span class="rounded-full bg-white/35 px-2 py-0.5 text-[10px] font-black uppercase tracking-widest">Quiz</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="mt-auto rounded-3xl border border-slate-100 bg-white/70 p-3">
      <p class="px-2 pb-3 text-sm font-bold text-slate-700">Signed in as {{ userName }}</p>
      <button (click)="onLogout()"
              class="flex w-full items-center justify-center rounded-2xl border border-red-100 bg-red-50/90 px-4 py-3 text-sm font-black text-red-600 transition-all hover:-translate-y-0.5 hover:bg-red-100">
        Sign Out
      </button>
    </div>
  </div>
</aside>
