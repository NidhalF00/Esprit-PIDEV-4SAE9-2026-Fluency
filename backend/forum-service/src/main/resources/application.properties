spring.application.name=forum-service
server.port=8082

# DATABASE
spring.datasource.url=jdbc:mysql://mysql:3306/forum_db?createDatabaseIfNotExist=true&useUnicode=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# dialect compatible Hibernate 7
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# JWT Secret (shared with auth-service)
