<div class="container mt-5">
  <div class="mb-3">

    <button class="btn btn-outline-secondary btn-sm" (click)="goBack()">

      <i class="fas fa-arrow-left me-1"></i> Back to Topics

    </button>

  </div>
  <!-- Header with title and toggle button -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary fw-bold">Replies</h2>
    <button class="btn btn-primary" (click)="showForm = !showForm">
      {{ showForm ? 'Close Form' : 'Add Reply' }}
    </button>
  </div>

  <!-- Reply form -->
  <app-reply-form *ngIf="showForm"
    [reply]="currentReply"
    [titleForm]="currentReply.id ? 'Edit Reply' : 'Add Reply'"
    (save)="handleSave($event)"
    (cancel)="cancelForm()">
  </app-reply-form>

  <!-- Replies list -->
  <ul class="list-group shadow-sm">
    <li class="list-group-item d-flex justify-content-between align-items-center mb-2 rounded hover-shadow" 
        *ngFor="let reply of replies">
      <div class="me-3 text-truncate" style="max-width: 70%;">
        {{ reply.content }}
      </div>
      <div class="d-flex">
        <button class="btn btn-warning btn-sm me-2" (click)="editReply(reply)">
          Edit
        </button>
        <button class="btn btn-danger btn-sm" (click)="deleteReply(reply.id!)">
          Delete
        </button>
      </div>
    </li>
  </ul>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteReplyModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-sm rounded">
      <div class="modal-header border-0">
        <h5 class="modal-title text-danger">Confirm Delete</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this reply?</p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>
