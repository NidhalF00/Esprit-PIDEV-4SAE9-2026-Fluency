services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluency-network

  eureka:
    build:
      context: ./backEnd/eureka
    image: fluency-eureka:compose
    ports:
      - "8761:8761"
    networks:
      - fluency-network

  user-service:
    build:
      context: ./backEnd/microservices/User
    image: fluency-user:compose
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      JWT_SECRET: ${JWT_SECRET}
      google.clientId: ${GOOGLE_CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - fluency-network

  quiz-service:
    build:
      context: ./backEnd/microservices/Quiz
    image: fluency-quiz:compose
    ports:
      - "8056:8056"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - quiz_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - fluency-network

  gateway:
    build:
      context: ./backEnd/Gateway
    image: fluency-gateway:compose
    ports:
      - "8090:8090"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      QUIZ_SERVICE_URL: http://quiz-service:8056
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
    depends_on:
      eureka:
        condition: service_started
      user-service:
        condition: service_started
      quiz-service:
        condition: service_started
    networks:
      - fluency-network

  frontend:
    build:
      context: ./frontEnd/EnglishPlateforme
    image: fluency-frontend:compose
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - fluency-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      eureka:
        condition: service_started
      gateway:
        condition: service_started
      user-service:
        condition: service_started
      quiz-service:
        condition: service_started
    networks:
      - fluency-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - fluency-network

volumes:
  postgres_data:
  quiz_uploads:
  grafana_data:

networks:
  fluency-network:
    driver: bridge
