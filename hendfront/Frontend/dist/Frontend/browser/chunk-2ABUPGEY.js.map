<div class="page">
  <div class="page-head">
    <h1>Questions</h1>
    <button mat-flat-button color="primary" type="button" (click)="add()">Ajouter</button>
  </div>

  @if (loadError()) {
    <p class="app-alert-error">{{ loadError() }}</p>
  }
  @if (loading()) {
    <p class="muted">Chargement…</p>
  } @else {
    <div class="table-wrap mat-elevation-z1">
      <table mat-table [dataSource]="dataSource" class="data-table">
        <ng-container matColumnDef="enonce">
          <th mat-header-cell *matHeaderCellDef>Énoncé</th>
          <td mat-cell *matCellDef="let row" class="cell-enonce">{{ row.enonce }}</td>
        </ng-container>
        <ng-container matColumnDef="typeQuestion">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let row">{{ row.typeQuestion }}</td>
        </ng-container>
        <ng-container matColumnDef="points">
          <th mat-header-cell *matHeaderCellDef>Points</th>
          <td mat-cell *matCellDef="let row">{{ row.points }}</td>
        </ng-container>
        <ng-container matColumnDef="quiz">
          <th mat-header-cell *matHeaderCellDef>Quiz</th>
          <td mat-cell *matCellDef="let row">{{ quizLabel(row) }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="col-actions">Actions</th>
          <td mat-cell *matCellDef="let row" class="col-actions">
            <button mat-stroked-button type="button" (click)="view(row)">Voir</button>
            <button mat-stroked-button type="button" color="primary" (click)="edit(row)">Modifier</button>
            <button mat-stroked-button type="button" color="warn" (click)="delete(row)">Supprimer</button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
      @if (dataSource.data.length === 0) {
        <p class="empty muted">Aucune question pour le moment.</p>
      }
    </div>
  }
</div>
