<table mat-table [dataSource]="courses" class="mat-elevation-z8">

  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Title</th>
    <td mat-cell *matCellDef="let course">{{ course.title }}</td>
  </ng-container>

  <ng-container matColumnDef="content">
    <th mat-header-cell *matHeaderCellDef>Content</th>
    <td mat-cell *matCellDef="let course">{{ course.content }}</td>
  </ng-container>

  <ng-container matColumnDef="coefficient">
    <th mat-header-cell *matHeaderCellDef>Coefficient</th>
    <td mat-cell *matCellDef="let course">{{ course.coefficient }}</td>
  </ng-container>

  <ng-container matColumnDef="hoursNumber">
    <th mat-header-cell *matHeaderCellDef>hoursNumber</th>
    <td mat-cell *matCellDef="let course">{{ course.hoursNumber }}</td>
  </ng-container>

  <!-- ACTIONS -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let course">
      <button mat-icon-button color="primary"
              (click)="editCourse(course)">
        ✏️
      </button>
      <button mat-icon-button color="warn"  (click)="deleteCourse(course)">
        🗑
      </button>

    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<mat-paginator
  [pageSize]="10"
  [pageSizeOptions]="[10, 15, 20]"
  showFirstLastButtons>
</mat-paginator>

<button mat-fab color="primary" (click)="openDialog()">
  <mat-icon>add</mat-icon>
</button>

<br>
