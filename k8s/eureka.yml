apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: fluency
  labels:
    app: eureka
    app.kubernetes.io/name: eureka
    app.kubernetes.io/part-of: fluency-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
        app.kubernetes.io/name: eureka
        app.kubernetes.io/part-of: fluency-platform
    spec:
      containers:
        - name: eureka
          image: mohamednoursassi/fluency-eureka:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eureka
  namespace: fluency
  labels:
    app: eureka
    app.kubernetes.io/name: eureka
    app.kubernetes.io/part-of: fluency-platform
spec:
  type: ClusterIP
  selector:
    app: eureka
  ports:
    - name: http
      port: 8761
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-nodeport
  namespace: fluency
  labels:
    app: eureka
    app.kubernetes.io/name: eureka
    app.kubernetes.io/part-of: fluency-platform
spec:
  type: NodePort
  selector:
    app: eureka
  ports:
    - name: http
      port: 8761
      targetPort: http
      nodePort: 30761
