apiVersion: v1
kind: Secret
metadata:
  name: fluency-secrets
  namespace: fluency
  labels:
    app.kubernetes.io/name: fluency
    app.kubernetes.io/part-of: fluency-platform
type: Opaque
stringData:
  DB_PASSWORD: "replace-with-db-password"
  JWT_SECRET: "replace-with-long-jwt-secret"
  MAIL_USERNAME: "replace-with-mail-username"
  MAIL_PASSWORD: "replace-with-mail-password"
  GOOGLE_CLIENT_ID: "replace-with-google-client-id"
  SPRING_SECURITY_USER_PASSWORD: "replace-with-spring-security-password"
